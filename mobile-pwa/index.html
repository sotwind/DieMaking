<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1890ff">
    <title>刀模管理系统 - 手机报工</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- 登录页面 -->
        <div id="login-page" class="page">
            <div class="login-container">
                <div class="logo">
                    <h1>刀模管理系统</h1>
                    <p>手机扫码报工</p>
                </div>
                <form id="login-form">
                    <div class="input-group">
                        <label>工号</label>
                        <input type="text" id="operator-no" placeholder="请输入工号" required>
                    </div>
                    <div class="input-group">
                        <label>姓名</label>
                        <input type="text" id="operator-name" placeholder="请输入姓名" required>
                    </div>
                    <button type="submit" class="btn-primary">进入系统</button>
                </form>
            </div>
        </div>

        <!-- 主页面 -->
        <div id="main-page" class="page hidden">
            <header class="app-header">
                <div class="header-title">扫码报工</div>
                <div class="header-user">
                    <span id="current-user"></span>
                    <button id="logout-btn" class="btn-text">退出</button>
                </div>
            </header>

            <main class="app-main">
                <!-- 扫码区域 -->
                <div class="scan-section">
                    <div id="scanner-container" class="scanner-container">
                        <video id="scanner-video" playsinline></video>
                        <canvas id="scanner-canvas" hidden></canvas>
                        <div class="scan-overlay">
                            <div class="scan-frame">
                                <div class="scan-line"></div>
                            </div>
                            <p class="scan-tip">将二维码对准框内即可自动扫描</p>
                        </div>
                    </div>
                    <button id="start-scan-btn" class="btn-primary btn-large">
                        <span class="icon">📷</span> 开始扫码
                    </button>
                    <button id="stop-scan-btn" class="btn-secondary btn-large hidden">
                        <span class="icon">⏹</span> 停止扫码
                    </button>
                </div>

                <!-- 手动输入 -->
                <div class="manual-section">
                    <div class="section-title">手动输入工单号</div>
                    <div class="input-row">
                        <input type="text" id="manual-workorder" placeholder="请输入工单号">
                        <button id="query-btn" class="btn-primary">查询</button>
                    </div>
                </div>

                <!-- 刀模信息展示 -->
                <div id="die-info-card" class="info-card hidden">
                    <div class="card-header">
                        <h3>刀模信息</h3>
                        <span id="die-status" class="status-badge"></span>
                    </div>
                    <div class="card-body">
                        <div class="info-row">
                            <span class="label">刀模编号：</span>
                            <span id="die-code" class="value"></span>
                        </div>
                        <div class="info-row">
                            <span class="label">工单号：</span>
                            <span id="work-order-no" class="value"></span>
                        </div>
                        <div class="info-row">
                            <span class="label">客户：</span>
                            <span id="customer-name" class="value"></span>
                        </div>
                        <div class="info-row">
                            <span class="label">产品：</span>
                            <span id="product-name" class="value"></span>
                        </div>
                    </div>
                </div>

                <!-- 工序列表 -->
                <div id="process-section" class="process-section hidden">
                    <div class="section-title">选择要报工的工序</div>
                    <div id="process-list" class="process-list">
                        <!-- 动态生成工序项 -->
                    </div>
                </div>

                <!-- 报工结果 -->
                <div id="report-result" class="result-panel hidden">
                    <div class="result-icon" id="result-icon">✓</div>
                    <div class="result-message" id="result-message">报工成功</div>
                    <button id="continue-btn" class="btn-primary">继续扫码</button>
                </div>
            </main>
        </div>
    </div>

    <!-- 加载 jsQR 库用于二维码识别 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="js/app.js"></script>
    <script src="js/scan.js"></script>
</body>
</html>
