<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1890ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>刀模报工系统</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 500;
        }
        
        .header .subtitle {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title .icon {
            width: 24px;
            height: 24px;
            background: #e6f7ff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1890ff;
            font-size: 14px;
        }
        
        .scan-area {
            border: 2px dashed #d9d9d9;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .scan-area:hover {
            border-color: #1890ff;
            background: #e6f7ff;
        }
        
        .scan-area.active {
            border-color: #52c41a;
            background: #f6ffed;
        }
        
        .scan-icon {
            font-size: 48px;
            color: #1890ff;
            margin-bottom: 15px;
        }
        
        .scan-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .scan-hint {
            font-size: 12px;
            color: #999;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #40a9ff;
        }
        
        .btn-primary:active {
            background: #096dd9;
        }
        
        .btn-success {
            background: #52c41a;
            color: white;
        }
        
        .btn-success:hover {
            background: #73d13d;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #d9d9d9;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #1890ff;
        }
        
        .die-info {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .die-info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #d9f7be;
        }
        
        .die-info-item:last-child {
            border-bottom: none;
        }
        
        .die-info-label {
            color: #666;
            font-size: 14px;
        }
        
        .die-info-value {
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }
        
        .process-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .process-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
            border-left: 4px solid #d9d9d9;
        }
        
        .process-item.pending {
            border-left-color: #faad14;
        }
        
        .process-item.completed {
            border-left-color: #52c41a;
            background: #f6ffed;
        }
        
        .process-name {
            font-weight: 500;
            color: #333;
        }
        
        .process-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
        }
        
        .process-status.pending {
            background: #fff7e6;
            color: #fa8c16;
        }
        
        .process-status.completed {
            background: #f6ffed;
            color: #389e0d;
        }
        
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 1000;
            display: none;
        }
        
        .toast.show {
            display: block;
        }
        
        .toast.success {
            background: rgba(82, 196, 26, 0.9);
        }
        
        .toast.error {
            background: rgba(255, 77, 79, 0.9);
        }
        
        #video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
        }
        
        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #video-container .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #1890ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 刀模报工系统</h1>
        <div class="subtitle">手机扫码快速报产</div>
    </div>
    
    <div class="container">
        <!-- 扫码区域 -->
        <div class="card" id="scan-card">
            <div class="card-title">
                <div class="icon">📷</div>
                扫码报工
            </div>
            <div class="scan-area" id="scan-btn">
                <div class="scan-icon">📷</div>
                <div class="scan-text">点击扫码</div>
                <div class="scan-hint">扫描易捷工单号二维码</div>
            </div>
            <div class="input-group" style="margin-top: 15px;">
                <label>或手动输入工单号</label>
                <input type="text" id="manual-input" placeholder="请输入工单号">
            </div>
            <button class="btn btn-primary" id="query-btn" style="margin-top: 10px;">查询刀模</button>
        </div>
        
        <!-- 刀模信息 -->
        <div class="card hidden" id="die-card">
            <div class="card-title">
                <div class="icon">📋</div>
                刀模信息
            </div>
            <div class="die-info" id="die-info">
                <!-- 动态填充 -->
            </div>
        </div>
        
        <!-- 工序列表 -->
        <div class="card hidden" id="process-card">
            <div class="card-title">
                <div class="icon">🔨</div>
                工序报产
            </div>
            <div class="process-list" id="process-list">
                <!-- 动态填充 -->
            </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="card hidden" id="action-card">
            <button class="btn btn-secondary" id="back-btn">返回扫码</button>
        </div>
    </div>
    
    <!-- 扫码视频 -->
    <div id="video-container">
        <video id="video" playsinline></video>
        <div class="close-btn" id="close-video">✕</div>
    </div>
    
    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>
    
    <script src="app.js"></script>
</body>
</html>
